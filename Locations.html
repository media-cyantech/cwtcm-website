<style>
  /* Tablet: shrink map */
  @media (max-width: 1024px) and (min-width: 769px) {
    .loc-map-frame { height: 380px !important; }
  }
  /* Mobile: stack cards, trust row to 2x2 */
  @media (max-width: 768px) {
    .container { padding: 0 20px !important; }
    nav { padding: 16px 18px !important; flex-wrap: wrap !important; }
    nav ul { display: none !important; }
    nav img { height: 64px !important; }
    nav > div:first-child > a > div {
      font-size: 13px !important; padding-left: 14px !important;
    }
    nav > div:last-child { gap: 10px !important; }
    nav > div:last-child > a {
      padding: 10px 16px !important; font-size: 11px !important;
    }

    section[data-screen-label="01 Header"] { padding: 56px 0 40px !important; }
    section[data-screen-label="01 Header"] h1 { font-size: 36px !important; }

    section[data-screen-label="02 Map"] { padding: 24px 0 16px !important; }
    .loc-map-frame { height: 300px !important; }
    section[data-screen-label="03 Cards"] { padding: 24px 0 64px !important; }
    .loc-grid { grid-template-columns: 1fr !important; gap: 20px !important; }

    section[data-screen-label="04 Standards"] { padding: 40px 0 !important; }
    .trust-row {
      grid-template-columns: 1fr 1fr !important;
      gap: 20px 16px !important;
    }
    .trust-row > div {
      border-left: none !important;
      border-top: 1px solid rgba(184,148,96,0.35);
      padding: 16px 8px 0 !important;
      font-size: 15px !important;
    }
    .trust-row > div:nth-child(1),
    .trust-row > div:nth-child(2) { border-top: none !important; padding-top: 0 !important; }

    section[data-screen-label="05 CTA"] { padding: 56px 0 64px !important; }
    section[data-screen-label="05 CTA"] p { font-size: 24px !important; }

    /* footer mirrors the homepage rules */
    footer { padding: 56px 0 28px !important; }
    footer > div > div:first-child {
      flex-wrap: wrap !important;
      gap: 14px !important;
      padding-bottom: 32px !important;
      margin-bottom: 36px !important;
    }
    footer > div > div:first-child img { height: 64px !important; }
    footer > div > div:first-child > div:nth-child(2) {
      font-size: 14px !important; padding-left: 14px !important;
    }
    footer > div > div:first-child > div:last-child {
      margin-left: 0 !important;
      flex-basis: 100% !important;
      text-align: left !important;
      font-size: 16px !important;
      max-width: none !important;
      padding-top: 8px !important;
      border-top: 1px solid rgba(184,148,96,0.25) !important;
    }
    footer > div > div:nth-child(2) {
      grid-template-columns: 1fr 1fr !important;
      gap: 32px !important;
      margin-bottom: 40px !important;
    }
    footer > div > div:nth-child(2) > div:first-child { grid-column: 1 / -1; }
    footer > div > div:nth-child(2) > div:last-child { grid-column: 1 / -1; }
    footer > div > div:last-child {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 12px !important;
    }
    footer > div > div:last-child > div:last-child {
      flex-wrap: wrap !important;
      gap: 14px 18px !important;
    }
  }
</style>
