<style>
  @media (max-width: 1024px) and (min-width: 769px) {
    .cdd-treatments-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  }
  @media (max-width: 768px) {
    .container { padding: 0 20px !important; }
    nav { padding: 16px 18px !important; flex-wrap: wrap !important; }
    nav ul { display: none !important; }
    nav img { height: 64px !important; }
    nav > div:first-child > a > div {
      font-size: 13px !important; padding-left: 14px !important;
    }
    nav > div:last-child { gap: 10px !important; }
    nav > div:last-child > a {
      padding: 10px 16px !important; font-size: 11px !important;
    }

    section[data-screen-label] { padding: 64px 0 !important; }
    section[data-screen-label="07 Book"] { padding: 72px 0 !important; }

    .cdd-hero-grid {
      grid-template-columns: 1fr !important; gap: 36px !important;
    }
    .cdd-hero-image { max-width: 420px !important; }

    .cdd-text-grid {
      grid-template-columns: 1fr !important; gap: 24px !important;
    }

    .cdd-treatments-grid {
      display: flex !important;
      grid-template-columns: none !important;
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      scroll-snap-type: x mandatory;
      margin: 0 -20px !important;
      padding: 4px 20px 14px !important;
      gap: 12px !important;
    }
    .cdd-treatments-grid > a {
      flex: 0 0 78% !important; min-width: 260px !important;
      scroll-snap-align: start;
    }

    /* footer collapse — mirror homepage */
    footer { padding: 56px 0 28px !important; }
    footer > div > div:first-child {
      flex-wrap: wrap !important;
      gap: 14px !important;
      padding-bottom: 32px !important;
      margin-bottom: 36px !important;
    }
    footer > div > div:first-child img { height: 64px !important; }
    footer > div > div:first-child > div:nth-child(2) {
      font-size: 14px !important; padding-left: 14px !important;
    }
    footer > div > div:first-child > div:last-child {
      margin-left: 0 !important; flex-basis: 100% !important;
      text-align: left !important; font-size: 16px !important;
      max-width: none !important; padding-top: 8px !important;
      border-top: 1px solid rgba(184,148,96,0.25) !important;
    }
    footer > div > div:nth-child(2) {
      grid-template-columns: 1fr 1fr !important;
      gap: 32px !important; margin-bottom: 40px !important;
    }
    footer > div > div:nth-child(2) > div:first-child { grid-column: 1 / -1; }
    footer > div > div:nth-child(2) > div:last-child { grid-column: 1 / -1; }
    footer > div > div:last-child {
      flex-direction: column !important; align-items: flex-start !important;
      gap: 12px !important;
    }
    footer > div > div:last-child > div:last-child {
      flex-wrap: wrap !important; gap: 14px 18px !important;
    }
  }
</style>
