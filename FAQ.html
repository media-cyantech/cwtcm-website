<script type="application/ld+json" id="faq-jsonld">{}</script>
<script>
(function(){
  // Build FAQPage JSON-LD from STRINGS.faq.en.items where schema=true.
  function onReady(fn){ if (document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
  onReady(function(){
    try {
      var src = (window.STRINGS && STRINGS.faq && STRINGS.faq.en && STRINGS.faq.en.items) || [];
      var schemaItems = src.filter(function(it){ return it.schema; });
      var data = {
        '@context': 'https://schema.org',
        '@type': 'FAQPage',
        'mainEntity': schemaItems.map(function(it){
          var stripHtml = (it.plainAnswer || it.a).replace(/<[^>]*>/g,'').trim();
          return {
            '@type': 'Question',
            'name': it.q,
            'acceptedAnswer': { '@type': 'Answer', 'text': stripHtml }
          };
        })
      };
      var node = document.getElementById('faq-jsonld');
      if (node) node.textContent = JSON.stringify(data);
    } catch(e){ /* swallow */ }
  });
})();
</script>
